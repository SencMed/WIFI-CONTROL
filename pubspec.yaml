    sdk: flutter
  network_info_plus: ^6.1.4
  permission_handler: ^11.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
